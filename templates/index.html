<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hebrew Text Summarizer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 800px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #1a1a2e;
            margin-bottom: 8px;
            font-size: 2rem;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 32px;
        }

        textarea {
            width: 100%;
            min-height: 200px;
            padding: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.2s;
            direction: rtl;
        }

        textarea:focus {
            outline: none;
            border-color: #4361ee;
        }

        .options {
            display: flex;
            gap: 12px;
            margin: 16px 0;
            justify-content: center;
            flex-wrap: wrap;
        }

        .options label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            padding: 8px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
        }

        .options input[type="radio"] {
            display: none;
        }

        .options input[type="radio"]:checked + span {
            color: #4361ee;
            font-weight: 700;
        }

        .options label:has(input:checked) {
            border-color: #4361ee;
            background: #eef0ff;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #4361ee;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 8px;
        }

        button:hover {
            background: #3451d1;
        }

        button:disabled {
            opacity: 0.65;
            cursor: wait;
        }

        .message {
            margin-top: 24px;
            padding: 18px;
            border-radius: 10px;
        }

        .result {
            background: #f8f9ff;
            border-right: 4px solid #4361ee;
        }

        .error {
            background: #fff5f5;
            border-right: 4px solid #c92a2a;
            color: #842029;
        }

        .message h2 {
            margin-bottom: 10px;
        }

        .message p {
            line-height: 1.8;
            white-space: pre-wrap;
        }

        .loading {
            display: none;
            text-align: center;
            color: #666;
            margin-top: 16px;
        }

        .counter {
            margin-top: 8px;
            color: #777;
            font-size: 0.9rem;
            text-align: left;
            direction: ltr;
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>📝 מסכם טקסט חכם</h1>
        <p class="subtitle">הדבק טקסט בעברית וקבל סיכום מיידי</p>

        <form method="post" action="/summarize" id="summary-form">
            <textarea
                id="text"
                name="text"
                placeholder="הדבק כאן את הטקסט שברצונך לסכם..."
                maxlength="{{ max_input_characters }}"
                required
            >{{ original_text or "" }}</textarea>

            <div class="counter">
                <span id="character-count">0</span> / {{ max_input_characters }}
            </div>

            <div class="options">
                <label>
                    <input
                        type="radio"
                        name="length"
                        value="short"
                        {{ 'checked' if selected_length == 'short' else '' }}
                    >
                    <span>קצר</span>
                </label>

                <label>
                    <input
                        type="radio"
                        name="length"
                        value="medium"
                        {{ 'checked' if selected_length == 'medium' else '' }}
                    >
                    <span>בינוני</span>
                </label>

                <label>
                    <input
                        type="radio"
                        name="length"
                        value="detailed"
                        {{ 'checked' if selected_length == 'detailed' else '' }}
                    >
                    <span>מפורט</span>
                </label>
            </div>

            <button type="submit" id="submit-button">סכם טקסט ✨</button>
        </form>

        <div class="loading" id="loading" aria-live="polite">
            ⏳ מסכם את הטקסט, אנא המתן...
        </div>

        {% if error %}
        <section class="message error" role="alert">
            <h2>שגיאה</h2>
            <p>{{ error }}</p>
        </section>
        {% endif %}

        {% if summary %}
        <section class="message result">
            <h2>הסיכום:</h2>
            <p>{{ summary }}</p>
        </section>
        {% endif %}
    </main>

    <script>
        const form = document.getElementById("summary-form");
        const textarea = document.getElementById("text");
        const loading = document.getElementById("loading");
        const submitButton = document.getElementById("submit-button");
        const characterCount = document.getElementById("character-count");

        function updateCharacterCount() {
            characterCount.textContent = textarea.value.length;
        }

        textarea.addEventListener("input", updateCharacterCount);
        updateCharacterCount();

        form.addEventListener("submit", () => {
            loading.style.display = "block";
            submitButton.disabled = true;
        });
    </script>
</body>
</html>
