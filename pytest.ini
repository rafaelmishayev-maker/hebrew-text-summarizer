[pytest]
testpaths = tests
# The application modules live in the repository root, not in an installed
# package, so the root must be importable for "from summarizer import ..." to
# resolve. Without this, the bare "pytest" command fails to collect the suite
# (only "python -m pytest" happens to work, since it adds the CWD implicitly).
pythonpath = .
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
